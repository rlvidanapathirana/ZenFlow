<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>ZenFlow — Ad-Free Hypnotherapy Audio Sessions</title>
    <meta name="description" content="ZenFlow is a free, ad-free hypnotherapy audio PWA for deep trance, sleep, binaural beats, nature sounds and guided meditation. Works offline." />
    <meta name="keywords" content="hypnotherapy, binaural beats, meditation, sleep, trance, PWA, offline audio" />
    <meta name="author" content="ZenFlow" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZenFlow" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="ZenFlow — Ad-Free Hypnotherapy Audio" />
    <meta property="og:description" content="Free, offline-capable hypnotherapy sessions. No ads. Pure healing." />
    <meta property="og:image"       content="/icons/pwa-512x512.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />

    <!-- Preload font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Prevent FOUC */
      html { background: #030712; }
      html:not(.dark) { background: #f0f4ff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
